name: AutoCast Conformance

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  autocast-reference-checks:
    name: AutoCast Reference Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Route evals
        run: npm run eval:strict

      - name: False-positive evals
        run: npm run eval:false-positive

      - name: False-negative evals
        run: npm run eval:false-negative

      - name: Security assurance evals
        run: npm run eval:security-assurance

      - name: Adapter conformance evals
        run: npm run eval:adapter-conformance

      - name: Adoption evidence evals
        run: npm run eval:adoption-evidence

      - name: Canonical layout evals
        run: npm run eval:canonical-layout

      - name: Runner syntax
        run: node --check bin/autocast.mjs
